<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Richfield Connect</title>
    <!--
      The application palette is light-only. Without this, a browser in dark
      mode renders native form controls dark-on-dark inside light screens.
    -->
    <meta name="color-scheme" content="light" />
    <style>
      /*
        A fixed-height page: every screen scrolls inside its own ScrollView, as on
        mobile. Earlier global overrides (forcing overflow:auto and min-height on
        every react-native-web view, and rewriting justify-content) made the tab
        navigator's screen container scrollable and let inactive tabs stretch to
        their content height, so scrolling past the end of one screen revealed the
        tab underneath. They also clipped long forms and collapsed space-between rows.
      */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #F6F8FA;
        overflow: hidden;
      }

      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
